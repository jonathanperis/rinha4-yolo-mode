name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  asm-tests:
    name: Pure assembly build and smoke tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install assembler deps
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends binutils make python3

      - name: Test
        run: make clean test

      - name: Docker Compose config
        run: docker compose config --quiet
