services:
  lb:
    image: "${LB_IMAGE:-ghcr.io/jonathanperis/rinha4-lb-yolo-mode@sha256:b76d44cb5dd4baa4b8383c843ded9a46551d38d338a1aa8dc4f3ec2e04ce71d3}"
    platform: linux/amd64
    pull_policy: always
    user: root
    environment:
      LB_MODE: "fdpass"
      LB_FDPASS_SOCKET_TYPE: "stream"
      LB_FDPASS_SNDBUF: "${LB_FDPASS_SNDBUF:-262144}"
      PORT: "9999"
      UPSTREAMS: "/tmp/rinha/api1.sock,/tmp/rinha/api2.sock"
      BACKLOG: "65535"
    ports:
      - "9999:9999"
    depends_on:
      - api1
      - api2
    volumes:
      - sockets:/tmp/rinha
    networks:
      - rinha
    logging:
      driver: "none"
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    deploy:
      resources:
        limits:
          cpus: "0.06"
          memory: "30M"

  api1:
    build: .
    image: "${WEBAPI_IMAGE:-rinha4-yolo-mode:local}"
    command: ["/app/api", "/tmp/rinha/api1.sock"]
    platform: linux/amd64
    volumes:
      - sockets:/tmp/rinha
    networks:
      - rinha
    logging:
      driver: "none"
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    deploy:
      resources:
        limits:
          cpus: "0.47"
          memory: "160M"

  api2:
    build: .
    image: "${WEBAPI_IMAGE:-rinha4-yolo-mode:local}"
    command: ["/app/api", "/tmp/rinha/api2.sock"]
    platform: linux/amd64
    volumes:
      - sockets:/tmp/rinha
    networks:
      - rinha
    logging:
      driver: "none"
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    deploy:
      resources:
        limits:
          cpus: "0.47"
          memory: "160M"

networks:
  rinha:
    driver: bridge

volumes:
  sockets:
